name: Telepítő frissítése

# Ha a telepito.bat változik, kicseréli a legújabb kiadás mellett is (a letöltési link ugyanaz marad).
on:
  push:
    branches: [main]
    paths: ["telepito.bat"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  csere:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Feltöltés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" telepito.bat --clobber
          echo "telepito.bat kicserélve: $TAG"
